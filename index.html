<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>会社ルールPDF翻訳システム</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">会社ルール専用 PDF 翻訳</p>
          <h1>会社ルールPDF翻訳システム</h1>
          <p class="hero-text">
            社内規定のPDFから日本語本文を抽出し、ミャンマー語・ベトナム語・ネパール語などに翻訳して保存・閲覧できます。利用する画面を選んでください。
          </p>
        </div>
      </header>

      <main class="role-grid">
        <a class="role-card" href="admin.html">
          <span class="role-icon" aria-hidden="true">⚙</span>
          <h2>管理者画面</h2>
          <p>PDFのアップロード、翻訳、ルールの編集・削除、QRコードの発行を行います。</p>
          <span class="primary-btn">管理者画面へ</span>
        </a>
        <a class="role-card" href="user.html">
          <span class="role-icon" aria-hidden="true">📖</span>
          <h2>利用者画面</h2>
          <p>翻訳済みのルールを自分の言語で閲覧します。スマートフォン向けです。</p>
          <span class="primary-btn">利用者画面へ</span>
        </a>
      </main>
    </div>
  </body>
</html>
