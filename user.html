<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お知らせ・ルール | 社内連絡・翻訳アプリ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body class="user-page">
    <nav class="top-nav">
      <a class="brand" href="user.html">社内連絡・翻訳アプリ</a>
    </nav>

    <div class="user-shell">
      <section class="user-bar">
        <label class="lang-select-label">
          <span>言語 / Language</span>
          <select id="user-lang" aria-label="表示言語"></select>
        </label>
        <label class="both-toggle">
          <input id="show-both" type="checkbox" />
          <span>日本語も表示<small>Show Japanese too</small></span>
        </label>
      </section>

      <nav id="user-tabs" class="user-tabs" aria-label="表示の切り替え" hidden>
        <button class="tab active" data-view="notices" type="button">お知らせ <small>News</small><span id="notice-new-count" class="tab-badge" hidden></span></button>
        <button class="tab" data-view="rules" type="button">ルール <small>Rules</small></button>
      </nav>

      <section id="notice-view" hidden>
        <p class="feed-intro">朝礼などの毎日の連絡と、新しいルールです。休みの日の内容もここで確認できます。</p>
        <div id="notice-feed" class="notice-feed"></div>
      </section>

      <section id="list-view" hidden>
        <h1 class="user-title">会社ルール一覧</h1>
        <p id="loading-note" class="muted"></p>
        <input id="user-search" class="list-search" type="search" placeholder="検索 / Search" aria-label="ルールを検索" />
        <div id="user-rule-list" class="user-rule-list"></div>
      </section>

      <section id="detail-view" hidden>
        <button id="back-btn" class="secondary-btn back-btn" type="button">← 一覧へ戻る</button>
        <article id="user-detail" class="user-detail"></article>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="shared.js"></script>
    <script src="cloud.js"></script>
    <script src="user.js"></script>
    <script src="user-notices.js"></script>
  </body>
</html>
